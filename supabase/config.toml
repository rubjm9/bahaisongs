# Minimal Supabase local config — runs the standard stack on default ports.
# Generated for the bahaisongs project. Adjust before deploying to a real
# Supabase Cloud project.

project_id = "bahaisongs"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Cloud dashboard must match production; local values are for `supabase start` only.
site_url = "https://bahaisongs.org"
additional_redirect_urls = [
  "https://bahaisongs.org/**",
  "http://localhost:3000/**",
]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
# Local-dev convenience: signUpWithPassword returns a session immediately.
# In Supabase Cloud (prod), turn Confirm email ON so new accounts must verify
# before signInWithPassword; the app shows a confirm-email step when there is no session.
enable_confirmations = false

[storage]
enabled = false  # We use Cloudflare R2, not Supabase Storage.

[edge_runtime]
enabled = true
inspector_port = 8083

[functions.sign-audio-url]
verify_jwt = false  # public read of approved tracks
